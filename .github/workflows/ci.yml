# Build and test every push to master and every pull request.
# Release bundles are produced by release.yml (tag push or manual run, with approval).
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        # 10.0.x, not `global-json-file`: the repo pins `10.0.0` with
        # rollForward latestMajor, which setup-dotnet cannot resolve.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore CSharp_RetroGameCoverDownloader.sln

      - name: Build (Release)
        run: dotnet build CSharp_RetroGameCoverDownloader.sln -c Release --no-restore

      - name: Test (excluding live GitHub integration tests)
        run: >
          dotnet test CSharp_RetroGameCoverDownloader.sln
          -c Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
