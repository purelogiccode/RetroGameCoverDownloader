# Release pipeline for RetroGameCoverDownloader.
#
# Flow:
#   1. version - resolves and validates the release version.
#   2. verify  - checks the csproj version, builds, and runs the tests.
#   3. bundles - publishes self-contained single-file bundles for six targets:
#                win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64.
#                Windows bundles are zip files; Linux bundles are tar.gz files;
#                macOS bundles are tar.gz archives containing a .app bundle.
#   4. publish - waits for approval in the protected `release` environment, then
#                creates or updates the GitHub release using WhatsNew.md as notes
#                and attaches every bundle.
#
# Cut a release by pushing a tag that matches the csproj version, e.g.:
#   git tag release_1.6.0 && git push origin release_1.6.0
# or run the workflow manually with the version input.
name: Release

on:
  push:
    tags:
      - 'release_*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, must match the csproj (e.g. 1.6.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: resolve
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^release_', '' }
          $version = "$version".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$version' - expected a three-part version such as 1.6.0." }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

  verify:
    name: Verify version, build & tests
    needs: [version]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        # 10.0.x, not `global-json-file`: the repo pins `10.0.0` with
        # rollForward latestMajor, which setup-dotnet cannot resolve.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Verify csproj version matches
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [xml]$project = Get-Content -LiteralPath RetroGameCoverDownloader\RetroGameCoverDownloader.csproj
          $assemblyVersion = $project.Project.PropertyGroup.AssemblyVersion | Where-Object { $_ } | Select-Object -First 1
          if ($assemblyVersion -ne $env:VERSION) {
            throw "Version mismatch: release $($env:VERSION) but AssemblyVersion is '$assemblyVersion'. Bump the csproj files first."
          }

      - name: Restore
        run: dotnet restore CSharp_RetroGameCoverDownloader.sln

      - name: Build (Release)
        run: dotnet build CSharp_RetroGameCoverDownloader.sln -c Release --no-restore

      - name: Test
        run: dotnet test CSharp_RetroGameCoverDownloader.sln -c Release --no-build

  bundles:
    name: Build ${{ matrix.rid }} bundle
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Package ${{ matrix.rid }}
        shell: pwsh
        run: >
          ./scripts/package-release.ps1
          -Version $env:VERSION
          -Runtimes ${{ matrix.rid }}
          -OutputDirectory artifacts
          -StagingDirectory "${{ runner.temp }}/rgcd-staging"
          -SkipTests

      - name: Write review summary with checksum
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath 'artifacts' -File | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash
          @(
            '## Bundle ready for review',
            '',
            ('- `{0}` - {1:N0} bytes - SHA256 `{2}`' -f $bundle.Name, $bundle.Length, $hash),
            '',
            'The **Publish release (approval required)** job is waiting in the protected `release` environment.'
          ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload bundle for review
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release (approval required)
    needs: [version, bundles]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: bundles
          merge-multiple: true

      - name: Verify the six expected bundles are present
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "release_${VERSION}_win-x64.zip"
            "release_${VERSION}_win-arm64.zip"
            "release_${VERSION}_linux-x64.tar.gz"
            "release_${VERSION}_linux-arm64.tar.gz"
            "release_${VERSION}_osx-x64.tar.gz"
            "release_${VERSION}_osx-arm64.tar.gz"
          )
          for name in "${expected[@]}"; do
            if [ ! -f "bundles/$name" ]; then
              echo "Missing expected bundle: $name" >&2
              exit 1
            fi
          done
          ls -lh bundles

      - name: Create or update the GitHub release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="release_${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading/replacing all bundles and updating the notes."
            gh release upload "$TAG" bundles/* --clobber
            gh release edit "$TAG" --notes-file WhatsNew.md
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" --target "$RELEASE_SHA" --title "$VERSION" --notes-file WhatsNew.md bundles/*
          else
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file WhatsNew.md bundles/*
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
